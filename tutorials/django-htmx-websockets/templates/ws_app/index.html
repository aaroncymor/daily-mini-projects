{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow" hx-ext="ws" ws-connect="/ws/live-updates/">
  <h2 class="text-xl font-bold mb-4">Live Updates Feed</h2>

  <div id="notifications-list" class="space-y-2 mb-6 min-h-[100px] border p-2 bg-gray-50 rounded">
    <p class="text-gray-400 text-sm italic">Waiting for broadcast activity...</p>
  </div>

  <!-- Alpine comment wrapping the HTMX Websocket submission -->
  <div x-data="{ open: false }">
    <button @click="open =!open" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
        Toggle Broadcast Form
    </button>
    <form x-show="open" ws-send @submit.prevent class="mt-4 space-y-2">
      <input
        type="text" name="message"
        placeholder="Type a message..."
        class="w-full border"
      />
      <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
        Send to Everyone
      </button>
    </form>
  </div>
</div>
{% endblock %}
