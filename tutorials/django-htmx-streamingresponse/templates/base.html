{% load django_htmx %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Django & HTMX Streaming Example</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  {% htmx_script version=4 %}
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  {% tailwind_css %}
  <!--<link rel="icon" href="favicon.png">-->
  {% block xtra_head %}{% endblock%}
</head>

<body hx-headers:inherited='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <main>
    <!-- Main Content -->
    {% block content %}
    {% endblock %}
  </main>

  {% block xtra_script %}{% endblock%}
</body>

</html>
