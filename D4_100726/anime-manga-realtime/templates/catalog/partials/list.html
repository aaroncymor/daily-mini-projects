<div id="catalogItems">
  {% if error %}
  <p class="text-red-500">{{ error }}</p>
  {% endif %}

  {% if page_obj and catalog_items %}
  {% for catalog_item in catalog_items %}
  {% if forloop.last and page_obj.has_next %}
  <div hx-trigger="revealed" hx-get="{% url 'catalog_list' %}?page={{ page_obj.number|add:1 }}"
    hx-include="#catalogSearch" hx-swap="afterend">
    {% else %}
    <div>
      {% endif %}
      <div id="catalog-{{ catalog_item.id }}" class="text-blue-700 cursor-pointer" @click="
              modalIsOpen = 'true';

              activeCatalog = {
                id: '{{ catalog_item.id }}',
                title: '{{ catalog_item.title|escapejs }}',
                description: '{{ catalog_item.description|escapejs }}',
                category: '{{ catalog_item.category }}',
                type: '{{ catalog_item.catalog_type|escapejs }}',
                score: '{{ catalog_item.score }}',
                episodes_volumes: '{{ catalog_item.episodes_volumes }}',
              };
            ">
        <span>{{ catalog_item.title }}</span>
      </div>
    </div>
    {% endfor %}
    {% endif %}
  </div>
