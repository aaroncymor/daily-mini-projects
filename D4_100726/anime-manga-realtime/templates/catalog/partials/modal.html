<!-- modal -->
<div
  x-cloak
  x-show="modalIsOpen && activeCatalog !== null"
  x-transition.opacity.duration.200ms x-trap.inert.noscroll="modalIsOpen && activeCatalog !== null"
  x-on:keydown.esc.window="
    modalIsOpen = 'false';
    activeCatalog = null;
  "
  x-on:click.self="
    modalIsOpen = 'false';
    activeCatalog = null;
  "
  class="catalog-item-modal fixed inset-0 z-30 flex items-end justify-center bg-black/20 p-4 pb-8 backdrop-blur-md sm:items-center lg:p-8"
  role="dialog" aria-modal="true" aria-labelledby="defaultModalTitle"
>
    <!-- Modal Dialog -->
    <div
      x-show="modalIsOpen && activeCatalog !== null"
      x-transition:enter="transition ease-out duration-200 delay-100 motion-reduce:transition-opacity"
      x-transition:enter-start="opacity-0 scale-50"
      x-transition:enter-end="opacity-100 scale-100"
      class="flex max-w-lg flex-col gap-4 overflow-hidden rounded-radius border border-outline bg-surface text-on-surface dark:border-outline-dark dark:bg-surface-dark-alt dark:text-on-surface-dark"
    >
      <!-- Dialog Header -->
      <div class="flex items-center justify-between border-b border-outline bg-surface-alt/60 p-4 dark:border-outline-dark dark:bg-surface-dark/20">
        <h3
          id="defaultModalTitle"
          class="font-semibold tracking-wide text-on-surface-strong dark:text-on-surface-dark-strong"
          x-text="activeCatalog.title"
        ></h3>
        <button
          x-on:click="
            modalIsOpen = 'false';
            activeCatalog = null;
          "
          aria-label="close modal"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="1.4" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <!-- Dialog Body -->
      <div class="modal-body px-4 py-8">
        <p x-text="activeCatalog.category"></p>
        <p x-text="activeCatalog.description"></p>
        <p x-text="activeCatalog.type"></p>
        <p x-text="activeCatalog.score"></p>
        <p x-text="activeCatalog.episodes_volumes"></p>
      </div>
    </div>
</div>
