<div id="subscribedManga">
  {% if manga_subs %}
    <ul class="space-y-2">
      {% for manga in manga_subs %}
        <li
          id="subscribed-{{ manga.manga_id }}"
          class="flex items-center justify-between p-2 border-b"
        >
          <span>{{ manga.title }}</span>

          <form
            hx-post="{% url 'manga_subscribe' manga.manga_id %}"
            hx-target="#subscribedManga"
            hx-swap="outerHTML"
          >
            {% csrf_token %}
            <!-- Force subscribe=false to unsubscribe -->
            <input type="hidden" name="subscribe" value="false">
            <button
              type="submit"
              class="text-red-500 hover:text-red-700 cursor-pointer text-sm"
            >
              [Remove from Watchlist]
            </button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-gray-500">No subscribed items yet.</p>
  {% endif %}
</div>
